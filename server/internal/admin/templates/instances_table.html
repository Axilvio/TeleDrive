<table>
  <thead><tr><th>ID</th><th>Name</th><th>Region</th><th>Host</th><th>Port</th><th>Active</th><th>Action</th></tr></thead>
  <tbody>
    {{range .Instances}}
    <tr>
      <td>{{.ID}}</td><td>{{.Name}}</td><td>{{.Region}}</td><td>{{.Host}}</td><td>{{.Port}}</td><td>{{.Active}}</td>
      <td>
        <form hx-post="/admin/instances/delete" hx-target="#instances-table" hx-swap="innerHTML">
          <input type="hidden" name="id" value="{{.ID}}" />
          <button>Delete</button>
        </form>
      </td>
    </tr>
    {{else}}
    <tr><td colspan="7">No instances</td></tr>
    {{end}}
  </tbody>
</table>
